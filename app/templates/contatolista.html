{% extends "base.html" %}

{% block content %}
<div class="container mt-5">
    <div class="row">
        <div class="col-md-12">
            <h1 class="mb-4">Lista de Contatos</h1>

            <form method="get" class="row mb-4">
                <div class="col-9">
                    <input type="text" name="pesquisar" class="form-control" placeholder="Pesquisar...">
                </div>
                <div class="col-3">
                    <button type="submit" class="btn btn-primary">Pesquisar</button>
                </div>
            </form>

            <div class="table-responsive">
                <table class="table">
                    <thead>
                        <tr>
                            <th>Nome</th>
                            <th>Email</th>
                            <th>Assunto</th>
                            <th>Respondido</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for contato in dados %}
                        <tr>
                            <td>{{ contato.nome }}</td>
                            <td>{{ contato.email }}</td>
                            <td>{{ contato.assunto }}</td>
                            <td>{{ "Sim" if contato.respondido else "Não" }}</td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
{% endblock %}
