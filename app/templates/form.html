{% extends "base.html" %}

{% block content %}

<main class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <section class="mb-5">
                <h3 class="mb-3">USANDO GET</h3>
                <form action="" method="get">
                    <div class="input-group">
                        <input type="text" name="pesquisar" class="form-control" placeholder="Pesquisar...">
                        <button class="btn btn-outline-primary" type="submit">Pesquisar</button>
                    </div>
                </form>
                <p class="mt-3"><strong>Você digitou GET:</strong> {{ pesquisar }}</p>
            </section>

            <hr>

            <section>
                <h3 class="mb-3">USANDO POST</h3>
                <form action="" method="post">
                    <div class="input-group mb-3">
                        <input type="text" name="pesquisar" class="form-control" placeholder="Pesquisar...">
                        <button class="btn btn-outline-primary" type="submit">Pesquisar</button>
                    </div>
                    <p><strong>Você digitou POST:</strong> {{ request.form.get('pesquisar', '') }}</p>
                </form>
            </section>
        </div>
    </div>
</main>
{% endblock %}
